name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    # One shell everywhere: PowerShell does not expand globs or support heredocs,
    # which is what broke the old Windows-only job.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tk and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff cryptography

      - name: Compile check
        run: python -m compileall -q xray_forge Xray_Forge.py

      - name: Lint (syntax errors and undefined names only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Unit tests (with coverage)
        run: |
          python -m pytest tests -v \
            --cov=xray_forge --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu-py312
          path: coverage.xml

      - name: GUI interaction tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest tests/test_gui.py -v
          else
            python -m pytest tests/test_gui.py -v
          fi

      - name: CLI smoke test
        run: |
          python -m xray_forge --help
          python Xray_Forge.py --help
          printf 'vless://13b8ac3f-e8de-4b2d-82db-e9130d288a54@188.114.97.6:443?security=tls&sni=x&fp=chrome&type=ws&host=x&path=%%2F#t\n' > "$RUNNER_TEMP/in.txt"
          python -m xray_forge convert "$RUNNER_TEMP/in.txt" "$RUNNER_TEMP/out.txt"
          test -s "$RUNNER_TEMP/out.txt"
          python -m xray_forge export "$RUNNER_TEMP/out.txt" "$RUNNER_TEMP/clash.yaml" --format clash
          python -m xray_forge export "$RUNNER_TEMP/out.txt" "$RUNNER_TEMP/sb.json" --format singbox
          test -s "$RUNNER_TEMP/clash.yaml" && test -s "$RUNNER_TEMP/sb.json"

      - name: GUI smoke test (launch and destroy)
        run: |
          cat > "$RUNNER_TEMP/gui_smoke.py" <<'PY'
          from xray_forge.app import App
          app = App()
          app.update()
          app.destroy()
          print("GUI smoke test passed")
          PY
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python "$RUNNER_TEMP/gui_smoke.py"
          else
            python "$RUNNER_TEMP/gui_smoke.py"
          fi

  ui:
    name: Electron UI (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cryptography

      - name: Install Playwright (Electron itself is not needed for the e2e tests)
        working-directory: electron
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Syntax check
        working-directory: electron
        run: |
          for f in main.js preload.js engine-client.js renderer/app.js; do node --check "$f"; done

      - name: End-to-end tests (renderer + real engine)
        working-directory: electron
        env:
          XRAY_FORGE_PYTHON: python
        run: npm test
