name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Read-only token: CI only checks code out and uploads artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13", "3.15"]
    # One shell everywhere: PowerShell does not expand globs or support heredocs,
    # which is what broke the old Windows-only job.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # every package, with sha256 hashes, from the committed lock (tools/update_locks.sh)
          pip install --require-hashes -r requirements-ci.lock

      - name: Compile check
        run: python -m compileall -q xray_forge Xray_Forge.py

      - name: Lint (syntax errors and undefined names only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Unit tests (with coverage)
        run: |
          python -m pytest tests -v \
            --cov=xray_forge --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-ubuntu-py312
          path: coverage.xml

      - name: CLI smoke test
        run: |
          python -m xray_forge --help
          python Xray_Forge.py --help
          printf 'vless://13b8ac3f-e8de-4b2d-82db-e9130d288a54@188.114.97.6:443?security=tls&sni=x&fp=chrome&type=ws&host=x&path=%%2F#t\n' > "$RUNNER_TEMP/in.txt"
          python -m xray_forge convert "$RUNNER_TEMP/in.txt" "$RUNNER_TEMP/out.txt"
          test -s "$RUNNER_TEMP/out.txt"
          python -m xray_forge export "$RUNNER_TEMP/out.txt" "$RUNNER_TEMP/clash.yaml" --format clash
          python -m xray_forge export "$RUNNER_TEMP/out.txt" "$RUNNER_TEMP/sb.json" --format singbox
          test -s "$RUNNER_TEMP/clash.yaml" && test -s "$RUNNER_TEMP/sb.json"

  ui:
    name: Electron UI (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-ci.lock

      - name: Install UI dependencies and Playwright
        working-directory: electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # the e2e tests use Chromium, not Electron
        run: |
          npm ci
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Syntax check
        working-directory: electron
        run: |
          for f in main.js preload.js engine-client.js engine-path.js files.js renderer/app.js; do node --check "$f"; done

      - name: End-to-end tests (renderer + real engine)
        working-directory: electron
        env:
          XRAY_FORGE_PYTHON: python
        run: npm test
