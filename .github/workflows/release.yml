name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: XrayForge-windows-x64
            exe: XrayForge.exe
          - os: ubuntu-latest
            artifact: XrayForge-linux-x64
            exe: XrayForge
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build single-file executable
        run: |
          pyinstaller --onefile --name XrayForge \
            --hidden-import xray_forge \
            --collect-submodules xray_forge \
            Xray_Forge.py
          dist/XrayForge --help >/dev/null

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist/pkg
          cp dist/XrayForge.exe dist/pkg/
          cp README.md LICENSE dist/pkg/ 2>/dev/null || cp README.md dist/pkg/
          cd dist/pkg && zip -r ../${{ matrix.artifact }}.zip . && cd ..

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/pkg
          cp dist/XrayForge dist/pkg/
          chmod +x dist/pkg/XrayForge
          cp README.md LICENSE dist/pkg/ 2>/dev/null || cp README.md dist/pkg/
          cd dist/pkg && zip -r ../${{ matrix.artifact }}.zip . && cd ..

      - name: Checksums
        run: |
          cd dist
          sha256sum ${{ matrix.artifact }}.zip > ${{ matrix.artifact }}.zip.sha256
          cat ${{ matrix.artifact }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.zip.sha256

  release:
    name: Attach binaries to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
