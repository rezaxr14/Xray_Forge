name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: XrayForge-windows-x64
            exe: XrayForge.exe
          - os: ubuntu-latest
            artifact: XrayForge-linux-x64
            exe: XrayForge
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('xray_forge/__init__.py').read_text()).group(1))")
          proj=$(python -c "import re,pathlib;print(re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag package=$pkg pyproject=$proj"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match xray_forge.__version__ ($pkg) / pyproject ($proj)"
            exit 1
          fi

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build single-file executable
        run: |
          pyinstaller --onefile --name XrayForge \
            --hidden-import xray_forge \
            --collect-submodules xray_forge \
            Xray_Forge.py
          dist/XrayForge --help >/dev/null

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist/pkg
          cp dist/XrayForge.exe dist/pkg/
          cp README.md LICENSE dist/pkg/ 2>/dev/null || cp README.md dist/pkg/
          cd dist/pkg && zip -r ../${{ matrix.artifact }}.zip . && cd ..

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/pkg
          cp dist/XrayForge dist/pkg/
          chmod +x dist/pkg/XrayForge
          cp README.md LICENSE dist/pkg/ 2>/dev/null || cp README.md dist/pkg/
          cd dist/pkg && zip -r ../${{ matrix.artifact }}.zip . && cd ..

      - name: Checksums
        run: |
          cd dist
          sha256sum ${{ matrix.artifact }}.zip > ${{ matrix.artifact }}.zip.sha256
          cat ${{ matrix.artifact }}.zip.sha256

      # Signing is optional: configure repo secrets GPG_PRIVATE_KEY (and
      # optionally GPG_PASSPHRASE). The secrets are exposed to this step only,
      # never to pip / pyinstaller / the test suite that run earlier.
      - name: Sign checksums (GPG, optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "no GPG_PRIVATE_KEY secret configured; skipping signing"
            exit 0
          fi
          cd dist
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in ./*.sha256; do
            if [ -n "$GPG_PASSPHRASE" ]; then
              echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
                --pinentry-mode loopback --detach-sign --armor \
                --output "$f.sig" "$f"
            else
              gpg --batch --yes --detach-sign --armor --output "$f.sig" "$f"
            fi
            echo "signed: $f"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.zip.sha256
            dist/${{ matrix.artifact }}.zip.sha256.sig

  release:
    name: Attach binaries to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
            dist/*.sha256.sig
