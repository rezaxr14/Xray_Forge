name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: XrayForge-windows-x64
            exe: XrayForge.exe
          - os: ubuntu-latest
            artifact: XrayForge-linux-x64
            exe: XrayForge
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_version.py "$GITHUB_REF_NAME"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest cryptography

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build single-file executable
        run: |
          pyinstaller --onefile --name XrayForge \
            --hidden-import xray_forge \
            --collect-submodules xray_forge \
            Xray_Forge.py
          dist/XrayForge --help >/dev/null

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist/pkg
          cp dist/XrayForge.exe dist/pkg/
          cp README.md LICENSE dist/pkg/ 2>/dev/null || cp README.md dist/pkg/
          # no `zip` binary on the Windows runners; archive with the stdlib
          python -c "import shutil; shutil.make_archive('dist/${{ matrix.artifact }}', 'zip', 'dist/pkg')"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/pkg
          cp dist/XrayForge dist/pkg/
          chmod +x dist/pkg/XrayForge
          cp README.md LICENSE dist/pkg/ 2>/dev/null || cp README.md dist/pkg/
          cd dist/pkg && zip -r ../${{ matrix.artifact }}.zip . && cd ..

      - name: Checksums
        run: |
          cd dist
          sha256sum ${{ matrix.artifact }}.zip > ${{ matrix.artifact }}.zip.sha256
          cat ${{ matrix.artifact }}.zip.sha256

      # Signing is optional: configure repo secrets GPG_PRIVATE_KEY (and
      # optionally GPG_PASSPHRASE). The secrets are exposed to this step only,
      # never to pip / pyinstaller / the test suite that run earlier.
      - name: Sign checksums (GPG, optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "no GPG_PRIVATE_KEY secret configured; skipping signing"
            exit 0
          fi
          cd dist
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in ./*.sha256; do
            if [ -n "$GPG_PASSPHRASE" ]; then
              echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
                --pinentry-mode loopback --detach-sign --armor \
                --output "$f.sig" "$f"
            else
              gpg --batch --yes --detach-sign --armor --output "$f.sig" "$f"
            fi
            echo "signed: $f"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.zip.sha256
            dist/${{ matrix.artifact }}.zip.sha256.sig

  desktop:
    name: Desktop app ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: XrayForge-desktop-windows-x64
            pattern: "*.exe"
            engine: xray-forge-engine.exe
          - os: ubuntu-latest
            artifact: XrayForge-desktop-linux-x64
            pattern: "*.AppImage"
            engine: xray-forge-engine
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_version.py "$GITHUB_REF_NAME"

      - name: Build the engine (PyInstaller, one-folder)
        run: |
          python -m pip install --upgrade pip
          # -e . makes `import xray_forge` work from any working directory
          # (the electron-builder step reads the version from electron/)
          pip install -e . -r requirements.txt cryptography pyinstaller
          pyinstaller --noconfirm --onedir --name xray-forge-engine \
            --exclude-module tkinter \
            --collect-submodules xray_forge \
            --hidden-import cryptography \
            Xray_Forge.py
          python tools/smoke_engine.py -- "dist/xray-forge-engine/${{ matrix.engine }}" serve

      - name: Stage the engine for electron-builder
        run: |
          rm -rf electron/engine-dist
          cp -r dist/xray-forge-engine electron/engine-dist

      - name: Install UI dependencies and run unit tests
        working-directory: electron
        run: |
          npm install
          node --test test/engine-client.test.js

      - name: Build the installer
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned unless you add signing
        run: |
          # the tag check above guarantees tag == package version on releases
          version="$(python -c 'import xray_forge; print(xray_forge.__version__)')"
          npx electron-builder --publish never -c.extraMetadata.version="$version"
          ls -la release

      - name: Checksums
        working-directory: electron/release
        run: |
          mkdir -p ../../out
          cp ${{ matrix.pattern }} ../../out/
          cd ../../out
          for f in ${{ matrix.pattern }}; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done

      # Signing is optional (same secrets as the CLI build); exposed to this step only.
      - name: Sign checksums (GPG, optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "no GPG_PRIVATE_KEY secret configured; skipping signing"
            exit 0
          fi
          cd out
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in ./*.sha256; do
            if [ -n "$GPG_PASSPHRASE" ]; then
              echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
                --pinentry-mode loopback --detach-sign --armor --output "$f.sig" "$f"
            else
              gpg --batch --yes --detach-sign --armor --output "$f.sig" "$f"
            fi
            echo "signed: $f"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  release:
    name: Attach binaries to GitHub Release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.sha256
            dist/*.sha256.sig
